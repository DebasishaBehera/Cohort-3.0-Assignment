<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <div class="nav">
            <div class="nav-container">
                <img src="./assets/logo.png" alt="logo">
                <div class="navigate">
                    <a href="#">New Arrivals</a>
                    <a href="#">Shop</a>
                    <a href="#">Beauty</a>
                    <a href="#">Sale</a>
                    <a href="#">Journal</a>
                </div>
                <div class="cart-option">
                    <i class="ri-search-line"></i>
                    <i class="ri-bnb-line"></i>
                    <div><i class="ri-shopping-cart-2-line"></i></div>
                </div>
            </div>
            <div class="line"></div>
        </div>

        <div class="top-left">
            <img class="flower" src="./assets/topFlower.png" alt="flower image">
            <p>Summer Collection</p>
            <div class="head">
                <h2>TRANDY AND</h2>
                <h2>CLUSSI FOR</h2>
                <h2>NEW SEASSON</h2>
            </div>
        </div>
        <div class="top-center">
            <h1>Make Your Fashion Look</h1>
            <h1> More Charming</h1>
            <img class="center-flower" src="./assets/centerFlower.png" alt="flower image">
        </div>
        <div class="top-right">
            <img src="./assets/round.png" alt="Round Image">
        </div>
        <div class="left-bottom">
            <img style="border-radius: 1rem;" src="./assets/img1.jpg" alt="image1">
            <img class="quote" src="./assets/quote.png" alt="quote">
        </div>
        <div class="center-left-top">
            <img src="./assets/img2.png" alt="image2">
        </div>
        <div class="center-left-bottom">
            <img src="./assets/img3.png" alt="image3">
        </div>
        <div class="center">
            <img src="./assets/img4.jpeg" alt="image4">
            <img src="./assets/star.png" alt="star" id="star">
        </div>
        <div class="center-right-top">
            <img src="./assets/img5.png" alt="image5">
        </div>
        <div class="center-right-bottom">
            <img src="./assets/img6.png" alt="image6">
        </div>
        <div class="right-bottom">
            <img src="./assets/img7.jpg" alt="image7">
            <h3>#2022</h3>
            <img class="lastFlower" src="./assets/lastFlower.png" alt="flower">
        </div>
        <div class="footer">
            <div class="text">
                <div class="para">
                    <p>I’m very much of the ‘buy less but buy</p>
                    <p>better’ philosophy. It’s what I’ve never really knew</p>
                </div>
                <img src="./assets/signature.png" alt="signature">
            </div>
            <div class="btn">
                <img class="mark" src="./assets/mark.png" alt="mark">
                <img class="footer-flower" src="./assets/footerFlower.png" alt="flower">
                <button>SCROLL Down <i class="ri-arrow-drop-down-line"></i></button>
            </div>
            <div class="moto">
                <div class="date">
                    <p>31 May 2022 . Blog</p>
                </div>
                <div class="moto-line">
                    <h1>01</h1>
                    <p>Always be strong <br> and have valus</p>
                    <i class="ri-arrow-right-circle-fill"></i>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
