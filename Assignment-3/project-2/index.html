<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="./assets/logo-bg.png" alt="logo">
            </div>
            <div class="navigation">
                <a href="">About</a>
                <a href="">Watch now</a>
                <a href="">Actors</a>
                <a href="">Contact</a>
            </div>
            <div class="menu">
                <i class="ri-menu-3-fill"></i>
            </div>
        </nav>
    </header>
    <main>
        <div class="hero">
            <div class="head">
                <img src="./assets/main.png" alt="img">
            </div>
            <div class="details">
                <p>Action / Thriller / Drama Series directed by Dong-hyuk-Hwang <br> Season 1: 9 Episodes</p>
            </div>
            <div class="play">
                <button class="now"><i class="ri-play-circle-line"></i> Play Now</button>
                <button class="watch"><i class="ri-play-line"></i> Watch Thriller</button>
            </div>
        </div>
        <div class="scroll">
            <div>
                <p>SCROLL</p>
            </div>
            <div class="line"></div>
        </div>
        <div class="cast">
            <img src="./assets/squad.png" alt="squad image">
        </div>
        <div class="social">
            <a href=""><i class="ri-twitter-line"></i></a>
            <a href=""><i class="ri-instagram-line"></i></a>
            <a href=""><i class="ri-facebook-line"></i></a>
        </div>
    </main>

    <footer>
        <div class="containers">
            <div class="container">
                <i class="ri-play-circle-line"></i>
                <img src="./assets/img1.jpg" alt="">
            </div>
            <div class="container">
                <i class="ri-play-circle-line img2"></i>
                <img src="./assets/img2.jpg" alt="">
            </div>
            <div class="container">
                <i class="ri-play-circle-line img3"></i>
                <img src="./assets/img3.jpg" alt="">
            </div>
        </div>
    </footer>
</body>

</html>
